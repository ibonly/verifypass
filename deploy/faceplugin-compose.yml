# VerifyPass — Faceplugin on-premise services (real, on-prem, no data leaves host).
#
#   docker compose -f deploy/faceplugin-compose.yml up -d
#
# Then activate each container's license once per machine (see deploy/faceplugin.md):
#   curl http://127.0.0.1:8888/get-machine-code
#   curl -X POST http://127.0.0.1:8888/activate-machine -H 'Content-Type: application/json' -d '{"license":"<LICENSE>"}'
#   curl http://127.0.0.1:8889/get-machine-code
#   curl -X POST http://127.0.0.1:8889/activate-machine -H 'Content-Type: application/json' -d '{"license":"<LICENSE>"}'
#
# Bound to 127.0.0.1 only — these services have no auth of their own.

services:
  faceplugin-liveness:
    image: faceplugin/face-anti-spoofing:20250605
    container_name: fp-liveness
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"

  faceplugin-face:
    # Build from https://github.com/Faceplugin-ltd/FaceRecognition-Docker
    #   git clone https://github.com/Faceplugin-ltd/FaceRecognition-Docker
    #   docker build -t face-recognition ./FaceRecognition-Docker
    image: face-recognition:latest
    container_name: fp-face
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8888"

  # Optional ID OCR (Faceplugin-ltd/ID-Card-Recognition). Uncomment when licensed
  # and set FACEPLUGIN_IDOCR_URL=http://127.0.0.1:8890 in .env.
  # faceplugin-idocr:
  #   image: id-card-recognition:latest
  #   container_name: fp-idocr
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8890:8888"
