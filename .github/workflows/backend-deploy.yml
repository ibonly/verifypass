name: backend-deploy
on:
  workflow_call:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      AWS_PARAMETER_NAME: ${{ vars.AWS_PARAMETER_NAME }}
      AWS_PARAMETER_VERSION: ${{ vars.AWS_PARAMETER_VERSION }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
      HOSTED_BASE_URL: ${{ vars.HOSTED_BASE_URL }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      EMAIL_API_URL: ${{ vars.EMAIL_API_URL }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      PROVIDER_MODEL_VERSION: ${{ vars.PROVIDER_MODEL_VERSION }}
      API_RESERVED_CONCURRENCY: ${{ vars.API_RESERVED_CONCURRENCY }}
      SCHEMA_CHANGE_APPROVED: ${{ vars.SCHEMA_CHANGE_APPROVED }}
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node deploy/config.cjs
      - run: npm ci --prefix backend && npm run prisma:generate --prefix backend
      - run: node backend/scripts/fetch-models.js
      - name: Install SAM before acquiring deployment credentials
        run: pipx install aws-sam-cli==1.145.2
      - name: Inspect GitHub OIDC Token Claims
        run: |
          # Request OIDC token from GitHub's runtime API
          TOKEN=$(curl -sLS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')

          # Decode and print the JWT payload (base64url to JSON)
          echo "=== Decoded OIDC Token Payload ==="
          echo "$TOKEN" | awk -F. '{print $2}' | base64 --decode 2>/dev/null | jq . || \
          echo "$TOKEN" | awk -F. '{print $2}' | tr '_-' '/+' | base64 -d | jq .
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Validate AWS runtime parameter
        run: node deploy/runtime-parameter.cjs
      - name: Validate, synchronize compatible schema, and deploy
        run: node deploy/aws.cjs
