name: frontend-deploy
on:
  workflow_call:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      CPANEL_SSH_HOST: ${{ vars.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ vars.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ vars.CPANEL_SSH_USER }}
      CPANEL_RELEASE_ROOT: ${{ vars.CPANEL_RELEASE_ROOT }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      HOSTED_BASE_URL: ${{ vars.HOSTED_BASE_URL }}
      EMAIL_API_URL: ${{ vars.EMAIL_API_URL }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cpanel-${{ github.sha }}
          path: artifact
      - name: Validate cPanel environment secrets
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          test -n "$CPANEL_SSH_KEY" || { echo "CPANEL_SSH_KEY is not visible to this job. Store it in the prod environment or repository secrets, and ensure this job uses environment: prod."; exit 1; }
          test -n "$CPANEL_KNOWN_HOSTS" || { echo "CPANEL_KNOWN_HOSTS is not visible to this job. Store it in the prod environment or repository secrets, and ensure this job uses environment: prod."; exit 1; }
      - name: Install browser smoke tooling without deployment secrets
        run: |
          npm ci --prefix frontend/sdk/react
          npm ci --prefix frontend/verify-page
          frontend/verify-page/node_modules/.bin/playwright install --with-deps chromium
      - name: Stage, promote, smoke-test and roll back on failure
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: node deploy/cpanel.cjs
