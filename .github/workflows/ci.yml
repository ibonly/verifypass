name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: verifypass/package-lock.json

      - name: Install dependencies
        working-directory: verifypass
        run: npm ci

      - name: Run CI checks
        working-directory: verifypass
        run: npm run ci