# CI — folder-local monorepo (no root workspace). Each area installs and
# tests independently.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test
      - name: Validate Prisma schema
        run: DATABASE_URL="mongodb://localhost:27017/verifypass" npx prisma validate --schema prisma/schema.prisma

  sdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/sdk/core } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test

  frontend-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install and test SDK core
        working-directory: frontend/sdk/core
        run: npm install && npm test
      - name: Install SDK react
        working-directory: frontend/sdk/react
        run: npm install
      - name: Build SDK JS standalone bundle
        working-directory: frontend/sdk/js
        run: npm install && npm run build
      - name: Build dashboard
        working-directory: frontend/dashboard
        run: npm install && npm run build
      - name: Build verify-page
        working-directory: frontend/verify-page
        run: npm install && npm run build
      - name: Build sample-app
        working-directory: sample-app
        run: npm install && npm run build
